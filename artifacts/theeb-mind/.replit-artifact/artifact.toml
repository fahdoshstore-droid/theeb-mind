kind = "web"
previewPath = "/"
title = "Theeb Mind"
version = "1.0.0"
id = "artifacts/theeb-mind"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20645

[services.development]
run = "pnpm --filter @workspace/theeb-mind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/theeb-mind", "run", "build" ]
serve = "static"
publicDir = "artifacts/theeb-mind/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20645"
BASE_PATH = "/"
